# Diagnostic ESP32 — dump Flame Connect BLE characteristics.
# Flash this on the SECOND board only.
# Unplug the fireplace ESP32 first (only one BLE client at a time).

substitutions:
  device_name: dimplex-ble-dump
  friendly_name: Dimplex BLE Dump

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: components
    components: [flame_dump]

esp32_ble:
  io_capability: keyboard_only

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: !secret fireplace_mac
    id: fireplace_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "DUMP: BLE connected"
    on_disconnect:
      then:
        - logger.log: "DUMP: BLE disconnected"
    on_passkey_request:
      then:
        - logger.log: "DUMP: pairing — sending PIN"
        - ble_client.passkey_reply:
            id: fireplace_ble
            passkey: !secret fireplace_pin

api:
  encryption:
    key: !secret dump_api_encryption_key

ota:
  - platform: esphome

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${device_name}-setup"
    password: !secret ap_password

captive_portal:

flame_dump:
  id: fireplace_dump
  ble_client_id: fireplace_ble
